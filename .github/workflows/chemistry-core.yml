name: Chemistry engines

permissions:
  contents: write
on:
  push:
    paths:
      - 'cpp/**'
      - 'tests/**'
      - 'scripts/**'
      - 'src/**'
      - 'simulation.html'
      - 'simulation.css'
      - 'compounds.html'
      - 'compounds.css'
      - 'microscope.html'
      - 'microscope.css'
      - 'wasm/**'
      - '.github/workflows/chemistry-core.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'tests/**'
      - 'scripts/**'
      - 'src/**'
      - 'simulation.html'
      - 'simulation.css'
      - 'compounds.html'
      - 'compounds.css'
      - 'microscope.html'
      - 'microscope.css'
      - 'wasm/**'
      - '.github/workflows/chemistry-core.yml'

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run native chemistry and kinetics tests
        run: bash scripts/test-native.sh
      - name: Check simulator JavaScript syntax
        run: node --input-type=module --check < src/simulation.js
      - name: Check compounds and reactions lab JavaScript syntax
        run: node --input-type=module --check < src/compound-reaction-lab.js
      - name: Check Lab 04 atom engine module syntax
        run: node --input-type=module --check < src/lab04-atom-engine.mjs
      - name: Test compounds, equations, atom conservation and stoichiometry
        run: node --test tests/compound-reactions.test.mjs
      - name: Test Lab 04 atom mapping, proton transfer, AgCl precipitation and Ksp gate
        run: node --test tests/lab04-atom-engine.test.mjs
      - name: Check microscope UI JavaScript syntax
        run: node --input-type=module --check < src/microscope-lab.js
      - name: Check interactive microscope instrument syntax
        run: node --input-type=module --check < src/microscope-instrument.js
      - name: Check microscope optics model syntax
        run: node --input-type=module --check < src/microscope-optics.mjs
      - name: Check microscope WASM physics wrapper syntax
        run: node --input-type=module --check < src/microscope-physics.mjs
      - name: Test microscope electron and AFM physics wrapper
        run: node --test tests/microscope-physics.test.mjs
      - name: Test microscope objective calibration and imaging physics
        run: node --test tests/microscope-optics.test.mjs
      - name: Test optical slide preparation workflow
        run: node --test tests/microscope-workflow.test.mjs
      - name: Test laboratory station interaction routing
        run: node --test tests/station-interaction.test.mjs
      - name: Test microscope specimen catalogue and technique compatibility
        run: node --test tests/microscope-samples.test.mjs
      - name: Test safe reagent mixing outcomes
        run: node --test tests/reagent-mixer.test.mjs
      - name: Test reaction presentation profiles
        run: node --test tests/reaction-visuals.test.mjs
      - name: Check mixing station JavaScript syntax
        run: node --input-type=module --check < src/mixing-station.js
      - name: Check live reaction particle renderer syntax
        run: node --input-type=module --check < src/reaction-fx.mjs
      - name: Test sequential reaction-stage timing
        run: node --test tests/reaction-stages.test.mjs
      - name: Test mechanism timeline checkpoint navigation
        run: node --test tests/mechanism-timeline.test.mjs
      - name: Test experimental CSV validation
        run: node --test tests/experimental-data.test.mjs
      - name: Test concentration-time CSV validation
        run: node --test tests/concentration-data.test.mjs

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build WebAssembly modules
        run: bash scripts/build-wasm.sh
      - name: Validate electron transport and AFM WebAssembly solvers
        run: |
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const electronModule = await WebAssembly.instantiate(fs.readFileSync('wasm/electron_transport.wasm'), {});
            const e = electronModule.instance.exports;
            const electronNames = ['memory','cv_electron_simulate','cv_electron_summary',
              'cv_electron_histogram','cv_electron_tracks','cv_electron_secondary_tracks',
              'cv_electron_secondary_track_count','cv_electron_last_error','cv_electron_engine_version'];
            for (const name of electronNames) if (!(name in e)) throw new Error('Missing electron export: ' + name);
            if (e.cv_electron_engine_version() !== 110) throw new Error('Unexpected electron transport version');
            const ep = e.cv_electron_simulate(320,29,63.546,8.96,20,500,0,12345,8,400);
            if (!ep || e.cv_electron_last_error() !== 0) throw new Error('Monte Carlo electron transport failed');
            const es = new Float64Array(e.memory.buffer,e.cv_electron_summary(),22);
            if (es[0] !== 320 || es[1]+es[2]+es[3] !== 320 || es[14] > 1e-7 ||
                es[11] < 0 || es[11] > 1 || es[12] < 0 || es[12] > 1) {
              throw new Error('Electron outcome or energy-conservation validation failed');
            }
            const tracks = new Float64Array(e.memory.buffer,e.cv_electron_tracks(),24*243);
            const secondaryTracks = new Float64Array(e.memory.buffer,e.cv_electron_secondary_tracks(),24*243);
            if (es[16]+es[17] !== es[4] || Math.abs(es[19]+es[20]-es[21]) > 1e-7 ||
                e.cv_electron_secondary_track_count() > 24 ||
                (e.cv_electron_secondary_track_count()>0 && (secondaryTracks[0]<2 || secondaryTracks[7]!==6))) {
              throw new Error('Secondary-electron track and energy accounting validation failed');
            }
            if (tracks[0] < 2 || Math.abs(tracks[2]-20) > 1e-9) {
              throw new Error('Electron trajectory output layout failed');
            }

            const afmModule = await WebAssembly.instantiate(fs.readFileSync('wasm/afm_interaction.wasm'), {});
            const a = afmModule.instance.exports;
            const afmNames = ['memory','cv_afm_height_input','cv_afm_scan','cv_afm_scan_begin',
              'cv_afm_scan_advance','cv_afm_scan_progress','cv_afm_scan_complete',
              'cv_afm_summary','cv_afm_output','cv_afm_last_error','cv_afm_engine_version'];
            for (const name of afmNames) if (!(name in a)) throw new Error('Missing AFM export: ' + name);
            if (a.cv_afm_engine_version() !== 120) throw new Error('Unexpected AFM engine version');
            const inputPointer = a.cv_afm_height_input();
            const heights = new Float64Array(a.memory.buffer,inputPointer,16*16);
            for (let y=0;y<16;y++) for (let x=0;x<16;x++) heights[y*16+x] = x<8?0:20;
            const ap = a.cv_afm_scan(16,800,8,.72,2,300,80,10,70,.23,25,1e-19,1,3,8,32,0,30);
            if (!ap || a.cv_afm_last_error() !== 0) throw new Error('AFM force-feedback scan failed');
            const as = new Float64Array(a.memory.buffer,a.cv_afm_summary(),12);
            const ao = new Float64Array(a.memory.buffer,a.cv_afm_output(),16*16*6);
            if (as[0] !== 16 || Math.abs(as[1]-3)>1e-8 || as[7] <= 0 ||
                Math.abs(ao[(8*16+12)*6]-20)>1e-7) {
              throw new Error('AFM contact-force or recovered-height validation failed');
            }

            if (!a.cv_afm_scan_begin(16,800,8,.72,2,300,80,10,70,.23,25,1e-19,1,3,8,32,0,30) ||
                a.cv_afm_scan_progress() !== 0 || a.cv_afm_scan_complete() !== 0) {
              throw new Error('AFM incremental scan did not initialise at zero progress');
            }
            let afmProgress = a.cv_afm_scan_advance(17);
            if (afmProgress !== 17 || a.cv_afm_scan_progress() !== 17 || a.cv_afm_scan_complete() !== 0) {
              throw new Error('AFM incremental scan did not expose its first batch');
            }
            while (afmProgress < 16*16) {
              const next = a.cv_afm_scan_advance(23);
              if (next <= afmProgress) throw new Error('AFM incremental scan stopped making progress');
              afmProgress = next;
            }
            if (a.cv_afm_scan_complete() !== 1 || afmProgress !== 16*16) {
              throw new Error('AFM incremental scan did not report completion');
            }
            const stagedSummary = new Float64Array(a.memory.buffer,a.cv_afm_summary(),12);
            if (Math.abs(stagedSummary[1]-3)>1e-8 ||
                !Number.isFinite(stagedSummary[4])) {
              throw new Error('AFM incremental summary values are invalid');
            }
            console.log('Electron Monte Carlo energy balance and AFM contact-force/height map validation passed');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Validate WebAssembly modules and kinetics curve
        run: |
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const chemistry = await WebAssembly.instantiate(fs.readFileSync('wasm/chemistry_core.wasm'), {});
            const c = chemistry.instance.exports;
            if (c.cv_reaction_is_balanced() !== 1) throw new Error('Stoichiometry validation failed');
            const stoichPointer = c.cv_calculate_reaction(10, 8, 0.5);
            const stoich = new Float64Array(c.memory.buffer);
            const offset = stoichPointer / 8;
            if (Math.abs(stoich[offset + 1] - 4) > 1e-9 ||
                Math.abs(stoich[offset + 2] - 6) > 1e-9) {
              throw new Error('Stoichiometry calculation failed');
            }

            const kinetics = await WebAssembly.instantiate(fs.readFileSync('wasm/kinetics_engine.wasm'), {});
            const k = kinetics.instance.exports;
            const names = ['cv_kinetics_simulate', 'cv_kinetics_last_error',
              'cv_kinetics_last_steps', 'cv_kinetics_effective_k',
              'cv_kinetics_atom_balance_ok', 'cv_kinetics_engine_version'];
            for (const name of names) if (!(name in k)) throw new Error('Missing kinetics export: ' + name);
            if (k.cv_kinetics_engine_version() !== 100) throw new Error('Unexpected kinetics version');

            const p = k.cv_kinetics_simulate(8, 16, 100, 0.2, 1, 0,
              25, 25, 0, 0, 5, 0.05, 101);
            if (!p || k.cv_kinetics_last_error() !== 0 || k.cv_kinetics_atom_balance_ok() !== 1) {
              throw new Error('Kinetics simulation or conservation check failed');
            }
            const curve = new Float64Array(k.memory.buffer, p, 101 * 6);
            const last = 100 * 6;
            if (Math.abs(curve[last + 3] - 2.9430355294) > 1e-5 ||
                Math.abs(curve[last + 2] + curve[last + 3] - 8) > 1e-7) {
              throw new Error('Kinetic time series validation failed');
            }
            for (let i = 1; i < 101; i++) {
              if (curve[i * 6 + 1] + 1e-10 < curve[(i - 1) * 6 + 1]) {
                throw new Error('Conversion must not decrease over time');
              }
            }
            const fitting = await WebAssembly.instantiate(fs.readFileSync('wasm/experimental_fit.wasm'), {});
            const f = fitting.instance.exports;
            const fitNames = ['memory', 'cv_fit_input_buffer', 'cv_fit_initial_rates',
              'cv_fit_last_error', 'cv_fit_engine_version'];
            for (const name of fitNames) if (!(name in f)) throw new Error('Missing fitting export: ' + name);
            if (f.cv_fit_engine_version() !== 100) throw new Error('Unexpected fitting engine version');
            const inputPointer = f.cv_fit_input_buffer();
            const fitInput = new Float64Array(f.memory.buffer, inputPointer, 6 * 3);
            const aValues = [0.10, 0.20, 0.40, 0.15, 0.30, 0.25];
            const bValues = [0.10, 0.10, 0.10, 0.20, 0.20, 0.40];
            for (let i = 0; i < 6; i++) {
              fitInput[i * 3] = aValues[i];
              fitInput[i * 3 + 1] = bValues[i];
              fitInput[i * 3 + 2] = 0.75 * Math.pow(aValues[i], 1.5) * Math.pow(bValues[i], 0.5);
            }
            const fitPointer = f.cv_fit_initial_rates(6, 25);
            if (!fitPointer || f.cv_fit_last_error() !== 0) {
              throw new Error('Initial-rate parameter fitting failed: ' + f.cv_fit_last_error());
            }
            const fitResult = new Float64Array(f.memory.buffer, fitPointer, 12);
            if (Math.abs(fitResult[0] - 0.75) > 2e-5 ||
                Math.abs(fitResult[1] - 1.5) > 2e-5 ||
                Math.abs(fitResult[2] - 0.5) > 2e-5 ||
                fitResult[3] < 0.999999) {
              throw new Error('Experimental fit did not recover known k, m, n parameters');
            }
            const concentrationFit = await WebAssembly.instantiate(fs.readFileSync('wasm/concentration_fit.wasm'), {});
            const cf = concentrationFit.instance.exports;
            const concentrationNames = ['memory', 'cv_concentration_fit_input_buffer',
              'cv_concentration_fit_initial_rates', 'cv_concentration_fit_last_error',
              'cv_concentration_fit_engine_version'];
            for (const name of concentrationNames) {
              if (!(name in cf)) throw new Error('Missing concentration-fit export: ' + name);
            }
            if (cf.cv_concentration_fit_engine_version() !== 100) {
              throw new Error('Unexpected concentration-fit engine version');
            }
            const concentrationPointer = cf.cv_concentration_fit_input_buffer();
            const concentrationInput = new Float64Array(cf.memory.buffer, concentrationPointer, 5 * 3);
            for (let i = 0; i < 5; i++) {
              concentrationInput[i * 3] = i;
              concentrationInput[i * 3 + 1] = 0.4 - 0.01 * i;
              concentrationInput[i * 3 + 2] = 0.3 - 0.01 * i;
            }
            const concentrationResultPointer = cf.cv_concentration_fit_initial_rates(5, 0.2);
            if (!concentrationResultPointer || cf.cv_concentration_fit_last_error() !== 0) {
              throw new Error('Concentration-time slope extraction failed');
            }
            const concentrationResult = new Float64Array(cf.memory.buffer, concentrationResultPointer, 14);
            if (Math.abs(concentrationResult[4] - 0.01) > 1e-9 ||
                Math.abs(concentrationResult[9] - 0.01) > 1e-9 ||
                concentrationResult[13] !== 1) {
              throw new Error('Concentration-time regression returned incorrect rates');
            }
            const mechanism = await WebAssembly.instantiate(fs.readFileSync('wasm/reaction_mechanism.wasm'), {});
            const m = mechanism.instance.exports;
            const mechanismNames = ['memory', 'cv_mechanism_atom_count', 'cv_mechanism_bond_count',
              'cv_mechanism_atom_id', 'cv_mechanism_atom_element', 'cv_mechanism_bond_atom_a',
              'cv_mechanism_bond_atom_b', 'cv_mechanism_bond_kind', 'cv_mechanism_stage',
              'cv_mechanism_event_count', 'cv_mechanism_event_progress',
              'cv_mechanism_event_change_count', 'cv_mechanism_event_bond_index',
              'cv_mechanism_event_bond_before', 'cv_mechanism_event_bond_after',
              'cv_mechanism_sample', 'cv_mechanism_validate', 'cv_mechanism_engine_version'];
            for (const name of mechanismNames) {
              if (!(name in m)) throw new Error('Missing mechanism export: ' + name);
            }
            if (m.cv_mechanism_engine_version() !== 110 ||
                m.cv_mechanism_atom_count() !== 14 ||
                m.cv_mechanism_bond_count() !== 15 ||
                m.cv_mechanism_event_count() !== 2 ||
                m.cv_mechanism_validate() !== 1) {
              throw new Error('Atom-mapped mechanism identity or conservation validation failed');
            }
            const eventProgress = [m.cv_mechanism_event_progress(0), m.cv_mechanism_event_progress(1)];
            const eventCounts = [m.cv_mechanism_event_change_count(0), m.cv_mechanism_event_change_count(1)];
            if (eventProgress[0] !== 0.5 || eventProgress[1] !== 1 ||
                eventCounts[0] !== 6 || eventCounts[1] !== 4) {
              throw new Error('Mechanism timeline event metadata is incorrect');
            }
            for (let event = 0; event < 2; event++) {
              for (let change = 0; change < eventCounts[event]; change++) {
                const bond = m.cv_mechanism_event_bond_index(event, change);
                const before = m.cv_mechanism_event_bond_before(event, change);
                const after = m.cv_mechanism_event_bond_after(event, change);
                if (bond < 0 || bond >= 15 || before < 0 || before > 2 ||
                    after < 0 || after > 2 || before === after) {
                  throw new Error('Mechanism event bond-change record is invalid');
                }
              }
            }
            const atomIds = Array.from({ length: 14 }, (_, i) => m.cv_mechanism_atom_id(i));
            if (new Set(atomIds).size !== 14 || atomIds.some(id => !id)) {
              throw new Error('Mechanism atom IDs must be stable and unique');
            }
            const intermediatePointer = m.cv_mechanism_sample(0.5);
            const intermediate = new Float64Array(m.memory.buffer, intermediatePointer, 14 * 4 + 15);
            if (intermediate[14 * 4 + 3] !== 0 || intermediate[14 * 4 + 11] !== 1) {
              throw new Error('Proton-transfer bond mapping failed');
            }
            const productPointer = m.cv_mechanism_sample(1);
            const products = new Float64Array(m.memory.buffer, productPointer, 14 * 4 + 15);
            if (products[14 * 4 + 8] !== 2 || products[14 * 4 + 9] !== 0 ||
                products[14 * 4 + 12] !== 1) {
              throw new Error('Carbonic-acid decomposition bond mapping failed');
            }
            const lab04Engine = await WebAssembly.instantiate(fs.readFileSync('wasm/lab04_atom_engine.wasm'), {});
            const le = lab04Engine.instance.exports;
            const lab04Names = ['memory', 'cv_lab04_atom_engine_configure',
              'cv_lab04_atom_engine_atom_input', 'cv_lab04_atom_engine_bond_input',
              'cv_lab04_atom_engine_atom_count', 'cv_lab04_atom_engine_bond_count',
              'cv_lab04_atom_engine_sample', 'cv_lab04_atom_engine_validate',
              'cv_lab04_atom_engine_last_error', 'cv_lab04_atom_engine_version'];
            for (const name of lab04Names) {
              if (!(name in le)) throw new Error('Missing Lab 04 atom-engine export: ' + name);
            }
            if (le.cv_lab04_atom_engine_version() !== 100) {
              throw new Error('Unexpected Lab 04 atom-engine version');
            }
            if (le.cv_lab04_atom_engine_configure(2, 1) !== 1) {
              throw new Error('Lab 04 atom-engine configure failed');
            }
            const atomInput = new Float64Array(le.memory.buffer,
              le.cv_lab04_atom_engine_atom_input(), 2 * 11);
            const atomRecords = [
              [8, 1001, 0, 0, 0, 1, 0, 0, 2, 0, 0],
              [1, 1002, 1, 0, 0, 1, 1, 0, 2, 0, 0]
            ];
            atomRecords.flat().forEach((value, index) => { atomInput[index] = value; });
            const bondInput = new Float64Array(le.memory.buffer,
              le.cv_lab04_atom_engine_bond_input(), 6);
            [0, 1, 0, 1, 0.5, 0].forEach((value, index) => { bondInput[index] = value; });
            if (le.cv_lab04_atom_engine_validate() !== 1) {
              throw new Error('Lab 04 atom map or bond graph validation failed');
            }
            const transitionPointer = le.cv_lab04_atom_engine_sample(0.5);
            if (!transitionPointer || le.cv_lab04_atom_engine_last_error() !== 0) {
              throw new Error('Lab 04 atom-engine sampling failed');
            }
            const transition = new Float64Array(le.memory.buffer, transitionPointer, 9);
            if (Math.abs(transition[8] - 0.5) > 1e-9) {
              throw new Error('Lab 04 atom-engine bond transition interpolation failed');
            }
            const lab04ProductPointer = le.cv_lab04_atom_engine_sample(1);
            const productSample = new Float64Array(le.memory.buffer, lab04ProductPointer, 9);
            if (Math.abs(productSample[8]) > 1e-9) {
              throw new Error('Lab 04 atom-engine final broken-bond state failed');
            }
            const lab04Models = await import('./src/lab04-atom-engine.mjs');
            const agcl = lab04Models.configureAtomEngine(le, 'silver-chloride-precipitation',
              { precipitationAllowed: true });
            if (agcl.atomCount !== 28 || agcl.bondCount !== 24 ||
                agcl.atoms.filter(atom => atom.element === 'Ag').length !== 4 ||
                agcl.atoms.filter(atom => atom.element === 'Cl').length !== 4 ||
                agcl.atoms.filter(atom => atom.element === 'Na').length !== 4) {
              throw new Error('AgCl atom map or conserved ion inventory failed');
            }
            const agclStartPointer = le.cv_lab04_atom_engine_sample(0);
            const agclStart = new Float64Array(le.memory.buffer, agclStartPointer, 28 * 4 + 24);
            const agclOffset = 28 * 4;
            for (let bond = 12; bond < 24; bond++) {
              if (Math.abs(agclStart[agclOffset + bond]) > 1e-9) {
                throw new Error('AgCl ionic contacts must start dissociated');
              }
            }
            const agclNucleusPointer = le.cv_lab04_atom_engine_sample(0.5);
            const agclNucleus = new Float64Array(le.memory.buffer, agclNucleusPointer, 28 * 4 + 24);
            for (let bond = 12; bond < 16; bond++) {
              if (Math.abs(agclNucleus[agclOffset + bond] - 1) > 1e-9) {
                throw new Error('AgCl initial four-ion nucleus did not form');
              }
            }
            for (let bond = 16; bond < 24; bond++) {
              if (Math.abs(agclNucleus[agclOffset + bond]) > 1e-9) {
                throw new Error('AgCl lattice growth occurred before the nucleus stage');
              }
            }
            const agclProductPointer = le.cv_lab04_atom_engine_sample(1);
            const agclProduct = new Float64Array(le.memory.buffer, agclProductPointer, 28 * 4 + 24);
            for (let bond = 12; bond < 24; bond++) {
              if (Math.abs(agclProduct[agclOffset + bond] - 1) > 1e-9) {
                throw new Error('AgCl ionic cluster did not complete its keyframed growth');
              }
            }
            lab04Models.configureAtomEngine(le, 'silver-chloride-precipitation',
              { precipitationAllowed: false });
            const unsaturatedPointer = le.cv_lab04_atom_engine_sample(1);
            const unsaturated = new Float64Array(le.memory.buffer, unsaturatedPointer, 28 * 4 + 24);
            for (let bond = 12; bond < 24; bond++) {
              if (Math.abs(unsaturated[agclOffset + bond]) > 1e-9) {
                throw new Error('Unsaturated solution must not form an AgCl precipitate');
              }
            }
            if (Math.abs(unsaturated[0] - (-2.45)) > 1e-9) {
              throw new Error('Unsaturated Ag+ coordinate changed despite the Ksp gate');
            }
            console.log('Stoichiometry, kinetics, fitting, concentration-time, atom-mapped neutralization, AgCl precipitation, Ksp gate, and timeline-event validation passed');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Publish validated WebAssembly binaries to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          remote_head="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Branch advanced during WASM validation; a newer workflow owns publishing."
            exit 0
          fi
          git add wasm/chemistry_core.wasm wasm/kinetics_engine.wasm wasm/experimental_fit.wasm wasm/concentration_fit.wasm wasm/reaction_mechanism.wasm wasm/lab04_atom_engine.wasm wasm/electron_transport.wasm wasm/afm_interaction.wasm
          if git diff --cached --quiet; then
            echo "Validated WebAssembly binaries are already up to date."
          else
            git commit -m "Update validated WebAssembly binaries [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload validated WebAssembly modules
        uses: actions/upload-artifact@v4
        with:
          name: chemverse-wasm-${{ github.sha }}
          path: |
            wasm/chemistry_core.wasm
            wasm/kinetics_engine.wasm
            wasm/experimental_fit.wasm
            wasm/concentration_fit.wasm
            wasm/reaction_mechanism.wasm
            wasm/lab04_atom_engine.wasm
            wasm/electron_transport.wasm
            wasm/afm_interaction.wasm
          if-no-files-found: error
          retention-days: 14
