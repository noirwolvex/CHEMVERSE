name: Chemistry engines

permissions:
  contents: write
on:
  push:
    paths:
      - 'cpp/**'
      - 'tests/**'
      - 'scripts/**'
      - 'src/**'
      - 'simulation.html'
      - 'simulation.css'
      - 'wasm/**'
      - '.github/workflows/chemistry-core.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'tests/**'
      - 'scripts/**'
      - 'src/**'
      - 'simulation.html'
      - 'simulation.css'
      - 'wasm/**'
      - '.github/workflows/chemistry-core.yml'

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run native chemistry and kinetics tests
        run: bash scripts/test-native.sh
      - name: Check simulator JavaScript syntax
        run: node --input-type=module --check < src/simulation.js
      - name: Test laboratory station interaction routing
        run: node --test tests/station-interaction.test.mjs
      - name: Test safe reagent mixing outcomes
        run: node --test tests/reagent-mixer.test.mjs
      - name: Check mixing station JavaScript syntax
        run: node --input-type=module --check < src/mixing-station.js
      - name: Test sequential reaction-stage timing
        run: node --test tests/reaction-stages.test.mjs
      - name: Test mechanism timeline checkpoint navigation
        run: node --test tests/mechanism-timeline.test.mjs
      - name: Test experimental CSV validation
        run: node --test tests/experimental-data.test.mjs
      - name: Test concentration-time CSV validation
        run: node --test tests/concentration-data.test.mjs

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build WebAssembly modules
        run: bash scripts/build-wasm.sh
      - name: Validate WebAssembly modules and kinetics curve
        run: |
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const chemistry = await WebAssembly.instantiate(fs.readFileSync('wasm/chemistry_core.wasm'), {});
            const c = chemistry.instance.exports;
            if (c.cv_reaction_is_balanced() !== 1) throw new Error('Stoichiometry validation failed');
            const stoichPointer = c.cv_calculate_reaction(10, 8, 0.5);
            const stoich = new Float64Array(c.memory.buffer);
            const offset = stoichPointer / 8;
            if (Math.abs(stoich[offset + 1] - 4) > 1e-9 ||
                Math.abs(stoich[offset + 2] - 6) > 1e-9) {
              throw new Error('Stoichiometry calculation failed');
            }

            const kinetics = await WebAssembly.instantiate(fs.readFileSync('wasm/kinetics_engine.wasm'), {});
            const k = kinetics.instance.exports;
            const names = ['cv_kinetics_simulate', 'cv_kinetics_last_error',
              'cv_kinetics_last_steps', 'cv_kinetics_effective_k',
              'cv_kinetics_atom_balance_ok', 'cv_kinetics_engine_version'];
            for (const name of names) if (!(name in k)) throw new Error('Missing kinetics export: ' + name);
            if (k.cv_kinetics_engine_version() !== 100) throw new Error('Unexpected kinetics version');

            const p = k.cv_kinetics_simulate(8, 16, 100, 0.2, 1, 0,
              25, 25, 0, 0, 5, 0.05, 101);
            if (!p || k.cv_kinetics_last_error() !== 0 || k.cv_kinetics_atom_balance_ok() !== 1) {
              throw new Error('Kinetics simulation or conservation check failed');
            }
            const curve = new Float64Array(k.memory.buffer, p, 101 * 6);
            const last = 100 * 6;
            if (Math.abs(curve[last + 3] - 2.9430355294) > 1e-5 ||
                Math.abs(curve[last + 2] + curve[last + 3] - 8) > 1e-7) {
              throw new Error('Kinetic time series validation failed');
            }
            for (let i = 1; i < 101; i++) {
              if (curve[i * 6 + 1] + 1e-10 < curve[(i - 1) * 6 + 1]) {
                throw new Error('Conversion must not decrease over time');
              }
            }
            const fitting = await WebAssembly.instantiate(fs.readFileSync('wasm/experimental_fit.wasm'), {});
            const f = fitting.instance.exports;
            const fitNames = ['memory', 'cv_fit_input_buffer', 'cv_fit_initial_rates',
              'cv_fit_last_error', 'cv_fit_engine_version'];
            for (const name of fitNames) if (!(name in f)) throw new Error('Missing fitting export: ' + name);
            if (f.cv_fit_engine_version() !== 100) throw new Error('Unexpected fitting engine version');
            const inputPointer = f.cv_fit_input_buffer();
            const fitInput = new Float64Array(f.memory.buffer, inputPointer, 6 * 3);
            const aValues = [0.10, 0.20, 0.40, 0.15, 0.30, 0.25];
            const bValues = [0.10, 0.10, 0.10, 0.20, 0.20, 0.40];
            for (let i = 0; i < 6; i++) {
              fitInput[i * 3] = aValues[i];
              fitInput[i * 3 + 1] = bValues[i];
              fitInput[i * 3 + 2] = 0.75 * Math.pow(aValues[i], 1.5) * Math.pow(bValues[i], 0.5);
            }
            const fitPointer = f.cv_fit_initial_rates(6, 25);
            if (!fitPointer || f.cv_fit_last_error() !== 0) {
              throw new Error('Initial-rate parameter fitting failed: ' + f.cv_fit_last_error());
            }
            const fitResult = new Float64Array(f.memory.buffer, fitPointer, 12);
            if (Math.abs(fitResult[0] - 0.75) > 2e-5 ||
                Math.abs(fitResult[1] - 1.5) > 2e-5 ||
                Math.abs(fitResult[2] - 0.5) > 2e-5 ||
                fitResult[3] < 0.999999) {
              throw new Error('Experimental fit did not recover known k, m, n parameters');
            }
            const concentrationFit = await WebAssembly.instantiate(fs.readFileSync('wasm/concentration_fit.wasm'), {});
            const cf = concentrationFit.instance.exports;
            const concentrationNames = ['memory', 'cv_concentration_fit_input_buffer',
              'cv_concentration_fit_initial_rates', 'cv_concentration_fit_last_error',
              'cv_concentration_fit_engine_version'];
            for (const name of concentrationNames) {
              if (!(name in cf)) throw new Error('Missing concentration-fit export: ' + name);
            }
            if (cf.cv_concentration_fit_engine_version() !== 100) {
              throw new Error('Unexpected concentration-fit engine version');
            }
            const concentrationPointer = cf.cv_concentration_fit_input_buffer();
            const concentrationInput = new Float64Array(cf.memory.buffer, concentrationPointer, 5 * 3);
            for (let i = 0; i < 5; i++) {
              concentrationInput[i * 3] = i;
              concentrationInput[i * 3 + 1] = 0.4 - 0.01 * i;
              concentrationInput[i * 3 + 2] = 0.3 - 0.01 * i;
            }
            const concentrationResultPointer = cf.cv_concentration_fit_initial_rates(5, 0.2);
            if (!concentrationResultPointer || cf.cv_concentration_fit_last_error() !== 0) {
              throw new Error('Concentration-time slope extraction failed');
            }
            const concentrationResult = new Float64Array(cf.memory.buffer, concentrationResultPointer, 14);
            if (Math.abs(concentrationResult[4] - 0.01) > 1e-9 ||
                Math.abs(concentrationResult[9] - 0.01) > 1e-9 ||
                concentrationResult[13] !== 1) {
              throw new Error('Concentration-time regression returned incorrect rates');
            }
            const mechanism = await WebAssembly.instantiate(fs.readFileSync('wasm/reaction_mechanism.wasm'), {});
            const m = mechanism.instance.exports;
            const mechanismNames = ['memory', 'cv_mechanism_atom_count', 'cv_mechanism_bond_count',
              'cv_mechanism_atom_id', 'cv_mechanism_atom_element', 'cv_mechanism_bond_atom_a',
              'cv_mechanism_bond_atom_b', 'cv_mechanism_bond_kind', 'cv_mechanism_stage',
              'cv_mechanism_event_count', 'cv_mechanism_event_progress',
              'cv_mechanism_event_change_count', 'cv_mechanism_event_bond_index',
              'cv_mechanism_event_bond_before', 'cv_mechanism_event_bond_after',
              'cv_mechanism_sample', 'cv_mechanism_validate', 'cv_mechanism_engine_version'];
            for (const name of mechanismNames) {
              if (!(name in m)) throw new Error('Missing mechanism export: ' + name);
            }
            if (m.cv_mechanism_engine_version() !== 110 ||
                m.cv_mechanism_atom_count() !== 14 ||
                m.cv_mechanism_bond_count() !== 15 ||
                m.cv_mechanism_event_count() !== 2 ||
                m.cv_mechanism_validate() !== 1) {
              throw new Error('Atom-mapped mechanism identity or conservation validation failed');
            }
            const eventProgress = [m.cv_mechanism_event_progress(0), m.cv_mechanism_event_progress(1)];
            const eventCounts = [m.cv_mechanism_event_change_count(0), m.cv_mechanism_event_change_count(1)];
            if (eventProgress[0] !== 0.5 || eventProgress[1] !== 1 ||
                eventCounts[0] !== 6 || eventCounts[1] !== 4) {
              throw new Error('Mechanism timeline event metadata is incorrect');
            }
            for (let event = 0; event < 2; event++) {
              for (let change = 0; change < eventCounts[event]; change++) {
                const bond = m.cv_mechanism_event_bond_index(event, change);
                const before = m.cv_mechanism_event_bond_before(event, change);
                const after = m.cv_mechanism_event_bond_after(event, change);
                if (bond < 0 || bond >= 15 || before < 0 || before > 2 ||
                    after < 0 || after > 2 || before === after) {
                  throw new Error('Mechanism event bond-change record is invalid');
                }
              }
            }
            const atomIds = Array.from({ length: 14 }, (_, i) => m.cv_mechanism_atom_id(i));
            if (new Set(atomIds).size !== 14 || atomIds.some(id => !id)) {
              throw new Error('Mechanism atom IDs must be stable and unique');
            }
            const intermediatePointer = m.cv_mechanism_sample(0.5);
            const intermediate = new Float64Array(m.memory.buffer, intermediatePointer, 14 * 4 + 15);
            if (intermediate[14 * 4 + 3] !== 0 || intermediate[14 * 4 + 11] !== 1) {
              throw new Error('Proton-transfer bond mapping failed');
            }
            const productPointer = m.cv_mechanism_sample(1);
            const products = new Float64Array(m.memory.buffer, productPointer, 14 * 4 + 15);
            if (products[14 * 4 + 8] !== 2 || products[14 * 4 + 9] !== 0 ||
                products[14 * 4 + 12] !== 1) {
              throw new Error('Carbonic-acid decomposition bond mapping failed');
            }
            console.log('Stoichiometry, kinetics, fitting, concentration-time, atom-mapped mechanism, and timeline-event validation passed');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Publish validated WebAssembly binaries to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wasm/chemistry_core.wasm wasm/kinetics_engine.wasm wasm/experimental_fit.wasm wasm/concentration_fit.wasm wasm/reaction_mechanism.wasm
          if git diff --cached --quiet; then
            echo "Validated WebAssembly binaries are already up to date."
          else
            git commit -m "Update validated WebAssembly binaries"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload validated WebAssembly modules
        uses: actions/upload-artifact@v4
        with:
          name: chemverse-wasm-${{ github.sha }}
          path: |
            wasm/chemistry_core.wasm
            wasm/kinetics_engine.wasm
            wasm/experimental_fit.wasm
            wasm/concentration_fit.wasm
            wasm/reaction_mechanism.wasm
          if-no-files-found: error
          retention-days: 14
